services:

  migrate:
    build: .
    command: sh -c "python manage.py migrate && python manage.py init_mongo"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      MONGO_HOST: mongo
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy   

  models:
    build: .
    command: python -c "from parcels.rag.retriever import _embeddings"
    environment:
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      - hf_cache:/root/.cache/fastembed
    env_file:
      - .env

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    volumes:
      - .:/app
      - hf_cache:/root/.cache/fastembed
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MONGO_HOST: mongo
      QDRANT_URL: http://qdrant:6333
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    depends_on:
      models:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: .
    command: celery -A delivery worker -l info
    restart: unless-stopped
    volumes:
      - .:/app
      - hf_cache:/root/.cache/fastembed
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MONGO_HOST: mongo
      QDRANT_URL: http://qdrant:6333
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started

  beat:
    build: .
    command: celery -A delivery beat -l info
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MONGO_HOST: mongo
      QDRANT_URL: http://qdrant:6333
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage      

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER}", "-p", 
        "${MONGO_PASSWORD}", "--authenticationDatabase", 
        "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s  

volumes:
  postgres_data:
  qdrant_data:
  mongo_data:
  hf_cache: