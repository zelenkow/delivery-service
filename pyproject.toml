[project]
name = "delivery-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django==6.1.1",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "fastembed>=0.8.1",
    "langchain-openai>=1.6.7",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.6",
    "pymongo>=4.18.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "celery-types>=0.26.0",
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.16.0",
    "radon>=6.0.1",
    "ruff>=0.16.9",
    "types-django-filter>=26.1.0.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.django-stubs]
django_settings_module = "delivery.settings"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "migrations"]
severity = "medium"
confidence = "medium"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "delivery.settings"
testpaths = ["tests"]

[tool.pyright]
reportIncompatibleVariableOverride = false

[tool.radon]
exclude = "tests/*"
